name: Daily capture

on:
  schedule:
    # Runs EVERY day. The job asks the market data what the latest trading
    # session is and records only when that session is new, so weekends,
    # holidays and unscheduled closures need no calendar logic -- and special
    # sessions (Muhurat trading) are picked up automatically.
    #
    # Two things about the timing, both learned the hard way:
    #
    # 1. Odd minutes. GitHub queues scheduled workflows best-effort and drops
    #    them under load. :00 and :30 are the most contended slots, so these
    #    sit at :37. The old '30 11' fired 145 and 166 minutes late on
    #    consecutive days, then was skipped altogether.
    #
    # 2. Two runs, not one. The job is idempotent -- it records only a session
    #    it has not already got -- so a second run costs nothing when the first
    #    succeeded, and rescues the day when the first is delayed or dropped.
    #
    # Both are safely past the 15:40 IST open-session gate.
    - cron: '37 10 * * *'   # 16:07 IST -- primary, just after the close
    - cron: '37 14 * * *'   # 20:07 IST -- backstop if the primary never fires
  workflow_dispatch:
    inputs:
      date:
        description: 'Capture for a specific date (YYYY-MM-DD). Blank = today IST.'
        required: false
      force:
        description: 'Bypass weekend / holiday / stale-data guards'
        type: boolean
        default: false

concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture screener
        run: |
          node scripts/capture.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Track prices of every symbol ever seen
        # Gives us the quiet days between appearances -- required for base
        # detection and since-first-appearance returns.
        run: |
          node scripts/track.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Rebuild dashboard
        run: node scripts/build-dashboard.mjs

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/dashboard.json

          if git diff --staged --quiet; then
            echo "nothing to commit (no new session)"
            exit 0
          fi

          git commit -m "capture: $(TZ=Asia/Kolkata date +%F)"

          # A bare `git push` here is a real failure mode: anyone pushing while
          # this job runs gets the job rejected non-fast-forward, and the day's
          # snapshot -- already built by the steps above -- is thrown away.
          # That is exactly what killed the 2026-09-05 runs.
          #
          # So rebase onto whatever arrived and retry. Conflicts resolve toward
          # this run's snapshot (-X theirs is "the commit being replayed"
          # during a rebase), and docs/dashboard.json is then regenerated from
          # data/ regardless, since it is fully derived and never authoritative.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — rebasing onto origin/main"
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              echo "could not rebase cleanly"
              exit 1
            fi
            node scripts/build-dashboard.mjs
            git add docs/dashboard.json
            git diff --staged --quiet || git commit --amend --no-edit
            sleep $((attempt * 3))
          done

          echo "still could not push after 5 attempts"
          exit 1

  deploy:
    needs: capture
    runs-on: ubuntu-latest
    # Shared with the push-triggered pages.yml so the two never deploy at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Pages must be enabled once by hand (Settings -> Pages -> Source:
      # GitHub Actions). `enablement: true` cannot do it: creating the site
      # is an admin operation and GITHUB_TOKEN is refused with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
