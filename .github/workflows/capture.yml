name: Daily capture

on:
  schedule:
    # 11:30 UTC == 17:00 IST, Mon-Fri. GitHub may delay scheduled runs by
    # several minutes under load; harmless here since NSE closed at 15:30.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Capture for a specific date (YYYY-MM-DD). Blank = today IST.'
        required: false
      force:
        description: 'Bypass weekend / holiday / stale-data guards'
        type: boolean
        default: false

concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture screener
        run: |
          node scripts/capture.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Track prices of every symbol ever seen
        # Gives us the quiet days between appearances -- required for base
        # detection and since-first-appearance returns.
        run: |
          node scripts/track.mjs \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Rebuild dashboard
        run: node scripts/build-dashboard.mjs

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/dashboard.json
          if git diff --staged --quiet; then
            echo "nothing to commit (skipped day)"
          else
            git commit -m "capture: $(date -u -d '+5 hours 30 minutes' +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Pages must be enabled once by hand (Settings -> Pages -> Source:
      # GitHub Actions). `enablement: true` cannot do it: creating the site
      # is an admin operation and GITHUB_TOKEN is refused with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
