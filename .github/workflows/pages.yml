name: Deploy dashboard

# The capture workflow deploys after each daily snapshot, but it only runs on a
# schedule -- so a change to the dashboard itself sat undeployed until the next
# 17:00 IST run. This publishes on push instead, so code changes go live at once.
#
# No loop risk: commits pushed by the capture job use GITHUB_TOKEN, and GitHub
# deliberately does not trigger workflows from those.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the capture workflow's deploy job so the two never race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
