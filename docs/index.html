<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1 id="screener-name">Screener Tracker</h1>
    <p class="sub" id="meta">loading…</p>
  </div>
  <div id="cfgstate" hidden></div>
  <button id="exportBtn" title="Download the rows currently on screen as CSV">Export CSV</button>
  <nav id="tabs">
    <button data-view="focus" class="active">Focus</button>
    <button data-view="session">Session</button>
    <button data-view="leaderboard">Leaderboard</button>
    <button data-view="bases">Bases</button>
    <button data-view="grid">Heat grid</button>
    <button data-view="sectors">Sectors</button>
  </nav>
</header>

<div id="banner" hidden></div>
<div id="filters" hidden></div>

<main id="app"><p class="empty">Loading…</p></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-inner">
    <button class="close" id="drawer-close" aria-label="Close">&times;</button>
    <div id="drawer-body"></div>
  </div>
</div>

<script src="metrics.js"></script>
<script src="app.js"></script>
</body>
</html>
